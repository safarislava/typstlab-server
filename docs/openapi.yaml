openapi: 3.0.0
info:
  title: TypstLab Server API
  description: Server-side API of the TypstLab collaborative editing platform, built in Go. Handles user authentication, project management, client-generated file uploads, real-time collaboration, awareness, and offline CRDT synchronization via RFC 6455 WebSockets.
  version: 1.0.0
servers:
  - url: typstlab-api.safarislava.tech/
    description: Local Development Server

paths:
  /register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid input or user already exists

  /login:
    post:
      summary: Authenticate user and get access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=eyJ...; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400
              description: HttpOnly cookies containing the access_token and refresh_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password

  /refresh:
    post:
      summary: Refresh JWT access token using the refresh cookie
      tags:
        - Authentication
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
          description: Refresh token cookie
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Renewed access_token and refresh_token cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing refresh token cookie
        '401':
          description: Invalid or expired refresh token

  /logout:
    post:
      summary: Log out current user and clear refresh session
      tags:
        - Authentication
      parameters:
        - in: cookie
          name: refresh_token
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Successfully logged out, cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired refresh token cookie (Max-Age=-1)

  /health:
    get:
      summary: Check health status of the server
      tags:
        - System
      responses:
        '200':
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /projects:
    post:
      summary: Create a new project
      tags:
        - Projects
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated project UUID
                  example: 123e4567-e89b-12d3-a456-426614174000
                name:
                  type: string
                  example: My Typst Report
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Insufficient role

  /projects/{projectID}:
    get:
      summary: Get details of a project
      tags:
        - Projects
      security:
        - CookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User is not a member of the project
        '404':
          description: Project not found

  /projects/{projectID}/files:
    get:
      summary: List all files in a project
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of project files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found

    post:
      summary: Upload a file (Typst or binary) with client-generated UUID
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated file UUID
                  example: c30980ef-51eb-47eb-ba05-89416a5db202
                name:
                  type: string
                  example: main.typ
                content:
                  type: string
                  format: byte
                  description: Base64-encoded file content or raw typst text
          multipart/form-data:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated file UUID
                name:
                  type: string
                  description: Custom filename (defaults to uploaded file name)
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: Invalid input or missing UUID/name
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /ws/projects/{projectID}:
    get:
      summary: Establish real-time collaboration and synchronization WebSocket session
      description: |
        Upgrades HTTP connection to an RFC 6455 persistent WebSocket session for real-time document collaboration, cursor tracking (Awareness), and offline CRDT synchronization.

        ### Protocol Requirements
        * **Mandatory WebSocket:** Requests without RFC 6455 WebSocket handshake headers (`Upgrade: websocket`, `Connection: Upgrade`, `Sec-WebSocket-Version: 13`) are strictly rejected with HTTP `426 Upgrade Required`.
        * **Authentication:** Requires `access_token` cookie (automatically sent by browser).
        * **Access Control:** User must be an authorized member/collaborator of the specified project (`403 Forbidden` if not authorized).

        ### JSON Message Envelope
        All frames exchanged over WebSocket are UTF-8 JSON text frames encapsulated in a common envelope:
        ```json
        {
          "type": "<message_type>",
          "payload": { ... }
        }
        ```
        Refer to `#/components/schemas/WSMessageEnvelope` and `#/components/schemas/WSMessageType`.

        ### Protocol Flow & Message Types
        1. **Awareness Snapshot (`awareness_snapshot`):**
           Upon joining the room, the server immediately sends an initial snapshot of active collaborators and their cursor positions (`#/components/schemas/WSAwarenessSnapshotPayload`).
        2. **Document & Metadata Synchronization (`sync_init` & `sync_response`):**
           Client initiates sync by sending `sync_init` (`#/components/schemas/WSSyncInitPayload`) with its local `metadata_state_vector` and Typst `content_vectors`.
           Server calculates the missing metadata and content deltas and replies with `sync_response` (`#/components/schemas/WSSyncResponsePayload`), containing `metadata_delta` and a list of instructions (`download`, `upload`, `apply_changes`).
        3. **Real-Time Typst CRDT Edits (`crdt_update`):**
           - **Client -> Server:** Client sends `crdt_update` (`#/components/schemas/WSCRDTUpdateRequest`) with `file_id` and Base64 `delta`.
           - **Server -> Room:** Server persists the delta and broadcasts `crdt_update` (`#/components/schemas/WSCRDTUpdateBroadcast`) with `file_id`, `sender_id`, and `delta` to all other participants.
        4. **File Tree / Metadata Updates (`metadata_update`):**
           - **Client -> Server:** Client sends `metadata_update` (`#/components/schemas/WSMetadataUpdateRequest`) with Base64 `delta`.
           - **Server -> Room:** Server merges metadata and broadcasts `metadata_update` (`#/components/schemas/WSMetadataUpdateBroadcast`) with `sender_id` and `delta` to all other participants.
        5. **Cursor & Presence Tracking (`awareness_update` & `awareness_remove`):**
           - **Client -> Server:** Client sends `awareness_update` (`#/components/schemas/WSAwarenessUpdateClientRequest`) with `file_id` and `cursor: {anchor, head}`.
           - **Server -> Room:** Server attaches user identity and color and broadcasts `awareness_update` (`#/components/schemas/WSUserPresence`) to other participants.
           - When a user disconnects, server broadcasts `awareness_remove` (`#/components/schemas/WSAwarenessRemovePayload`) with `user_id`.
        6. **Heartbeat (`ping` & `pong`):**
           Client and server periodically exchange `ping` and `pong` to verify connection liveness.
        7. **Server Errors (`error`):**
           Server sends `error` (`#/components/schemas/WSErrorPayload`) when payload decoding or domain processing fails.
      tags:
        - Collaboration
      security:
        - CookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: access_token
          in: cookie
          required: false
          description: JWT Access token cookie automatically sent by browser clients.
          schema:
            type: string
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            example: websocket
        - name: Connection
          in: header
          required: true
          schema:
            type: string
            example: Upgrade
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema:
            type: string
            example: "13"
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols - WebSocket connection established successfully
        '400':
          description: Invalid project UUID
        '401':
          description: Unauthorized - missing or invalid Bearer token
        '403':
          description: Forbidden - user is not a collaborator in this project
        '404':
          description: Project not found
        '426':
          description: Upgrade Required - device does not support RFC 6455 WebSocket
          headers:
            Upgrade:
              schema:
                type: string
                example: websocket
            Connection:
              schema:
                type: string
                example: Upgrade
            Sec-WebSocket-Version:
              schema:
                type: string
                example: "13"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Upgrade Required
                  message:
                    type: string
                    example: WebSocket is mandatory for real-time collaboration. This device does not support RFC 6455.

  /projects/{projectID}/files/{fileID}:
    delete:
      summary: Delete a file from a project
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: File deleted successfully
        '400':
          description: File does not belong to the project or invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: File or Project not found

  /files/typst/{fileID}:
    get:
      summary: Retrieve a Typst file's metadata, CRDT state, and parsed blocks
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: fileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Typst file content and state retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypstFileResponse'
        '400':
          description: Not a Typst file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: File not found

  /files/binary/{fileID}:
    get:
      summary: Get metadata of a binary file
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: fileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Binary file metadata retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinaryFileMetadataResponse'
        '400':
          description: Not a binary file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: File not found

  /files/binary/{fileID}/raw:
    get:
      summary: Download binary file content directly
      tags:
        - Files
      security:
        - CookieAuth: []
      parameters:
        - name: fileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Raw file bytes
          headers:
            Content-Type:
              schema:
                type: string
                example: application/octet-stream
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename=logo.png
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Not a binary file
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: File not found

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT Access token stored in an HttpOnly, Secure cookie.

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: securepassword123

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ProjectCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        updated_at:
          type: string
          format: date-time

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        user_ids:
          type: array
          items:
            type: string
            format: uuid
        updated_at:
          type: string
          format: date-time

    FileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [typst, binary]
        updated_at:
          type: string
          format: date-time

    TypstFileResponse:
      type: object
      description: Typst file format with CRDT binary state.
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          example: typst
        state:
          type: string
          format: byte
          description: Base64-encoded merged Yjs binary state
        updated_at:
          type: string
          format: date-time

    BinaryFileMetadataResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          example: binary
        size:
          type: integer
          description: Content size in bytes
        updated_at:
          type: string
          format: date-time

    WSMessageType:
      type: string
      enum:
        - sync_init
        - sync_response
        - crdt_update
        - metadata_update
        - awareness_snapshot
        - awareness_update
        - awareness_remove
        - ping
        - pong
        - error
      description: Real-time collaboration message types over WebSocket.

    WSMessageEnvelope:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          $ref: '#/components/schemas/WSMessageType'
        payload:
          type: object
          description: Message payload conforming to the specific schema of message type.

    WSSyncInitPayload:
      type: object
      description: Client initial synchronization request payload (Client -> Server).
      properties:
        metadata_state_vector:
          type: string
          format: byte
          description: Base64-encoded client project metadata CRDT state vector.
        content_vectors:
          type: object
          additionalProperties:
            type: string
            format: byte
          description: Map of file UUID to Base64-encoded content Yjs state vector (for Typst files).

    WSSyncInstruction:
      type: object
      required:
        - action
        - file_id
      properties:
        action:
          type: string
          enum: [download, upload, apply_changes]
          example: download
          description: Action instruction for synchronizing file content.
        file_id:
          type: string
          format: uuid
          example: f5127cd9-4099-4c12-a74e-6e4695e263ab
        delta:
          type: string
          format: byte
          description: Base64-encoded CRDT delta update (included for apply_changes).

    WSSyncResponsePayload:
      type: object
      description: Server initial synchronization response payload (Server -> Client).
      properties:
        metadata_delta:
          type: string
          format: byte
          description: Base64-encoded binary CRDT delta update of project metadata from server.
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/WSSyncInstruction'
          description: List of content synchronization commands computed by server.

    WSCRDTUpdateRequest:
      type: object
      description: Client-initiated Typst CRDT delta update payload (Client -> Server).
      required:
        - file_id
        - delta
      properties:
        file_id:
          type: string
          format: uuid
          example: c30980ef-51eb-47eb-ba05-89416a5db202
        delta:
          type: string
          format: byte
          description: Base64-encoded Yjs binary update delta.

    WSCRDTUpdateBroadcast:
      type: object
      description: Server-broadcast Typst CRDT delta update payload (Server -> Collaborators).
      required:
        - file_id
        - sender_id
        - delta
      properties:
        file_id:
          type: string
          format: uuid
          example: c30980ef-51eb-47eb-ba05-89416a5db202
        sender_id:
          type: string
          format: uuid
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          description: Authenticated user UUID of the author who made the change. Stamped by server.
        delta:
          type: string
          format: byte
          description: Base64-encoded Yjs binary update delta.

    WSMetadataUpdateRequest:
      type: object
      description: Client-initiated file tree / project metadata CRDT delta update (Client -> Server).
      required:
        - delta
      properties:
        delta:
          type: string
          format: byte
          description: Base64-encoded metadata Yjs binary update delta.

    WSMetadataUpdateBroadcast:
      type: object
      description: Server-broadcast project metadata CRDT delta update (Server -> Collaborators).
      required:
        - sender_id
        - delta
      properties:
        sender_id:
          type: string
          format: uuid
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          description: Authenticated user UUID of the author who modified the metadata. Stamped by server.
        delta:
          type: string
          format: byte
          description: Base64-encoded metadata Yjs binary update delta.

    WSCursor:
      type: object
      description: Caret position and text selection range within active file.
      required:
        - anchor
        - head
      properties:
        anchor:
          type: integer
          example: 42
          description: Starting character offset of selection / caret.
        head:
          type: integer
          example: 42
          description: Ending character offset of selection / caret.

    WSUserPresence:
      type: object
      description: Collaborator awareness presence and caret info.
      required:
        - user_id
        - email
        - color
        - file_id
        - cursor
      properties:
        user_id:
          type: string
          format: uuid
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        email:
          type: string
          format: email
          example: user@example.com
        color:
          type: string
          example: "#3B82F6"
          description: Deterministic HEX color code assigned to collaborator.
        file_id:
          type: string
          format: uuid
          example: c30980ef-51eb-47eb-ba05-89416a5db202
          description: Active file currently being edited by collaborator.
        cursor:
          $ref: '#/components/schemas/WSCursor'

    WSAwarenessSnapshotPayload:
      type: object
      description: Initial room presence snapshot sent upon connection (Server -> Client).
      required:
        - presences
      properties:
        presences:
          type: array
          items:
            $ref: '#/components/schemas/WSUserPresence'
          description: List of all active collaborators in the project room.

    WSAwarenessUpdateClientRequest:
      type: object
      description: Client cursor position update payload (Client -> Server).
      required:
        - file_id
        - cursor
      properties:
        file_id:
          type: string
          format: uuid
          example: c30980ef-51eb-47eb-ba05-89416a5db202
        cursor:
          $ref: '#/components/schemas/WSCursor'

    WSAwarenessRemovePayload:
      type: object
      description: Notification sent when a collaborator disconnects from room (Server -> Collaborators).
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11

    WSErrorPayload:
      type: object
      description: Error message payload sent by server on malformed or rejected messages (Server -> Client).
      required:
        - message
      properties:
        message:
          type: string
          example: invalid crdt update payload
